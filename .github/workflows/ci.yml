name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU-only PyTorch first
        run: |
          pip install torch==2.3.0+cpu --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn pydantic numpy transformers==4.37.0

      - name: Check app imports correctly
        run: |
          python -c "from api.main import app; print('App loaded successfully')"

      - name: Check API health endpoint
        run: |
          uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 10
          curl -f http://localhost:8000/ || exit 1
          echo "Health check passed"